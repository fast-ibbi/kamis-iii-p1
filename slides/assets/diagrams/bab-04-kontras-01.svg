<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" role="img" aria-label="Lima pasangan warna Tokosaya diukur terhadap garis ambang AA 4,5 banding 1. Empat lolos; hijau 16A34A di atas putih hanya 3,3 banding 1 dan gagal untuk teks kecil.">

  <!-- garis ambang AA -->
  <line x1="331" y1="40" x2="331" y2="300" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="337" y="34" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#dc2626">ambang AA 4,5:1</text>

  <!-- baris 1: #334155 di #F8FAFC 9,9:1 -->
  <rect x="64" y="54" width="26" height="26" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="77" y="73" font-family="system-ui, sans-serif" font-size="12" fill="#334155" text-anchor="middle">Aa</text>
  <text x="100" y="74" font-family="system-ui, sans-serif" font-size="14" fill="#475569">#334155</text>
  <rect x="230" y="52" width="222" height="30" rx="5" fill="#334155"/>
  <text x="462" y="73" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#111827">9,9:1</text>
  <text x="712" y="73" font-family="system-ui, sans-serif" font-size="13" fill="#6b7280">lolos</text>

  <!-- baris 2: #1E293B di #F8FAFC 14:1 -->
  <rect x="64" y="102" width="26" height="26" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="77" y="121" font-family="system-ui, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle">Aa</text>
  <text x="100" y="122" font-family="system-ui, sans-serif" font-size="14" fill="#475569">#1E293B</text>
  <rect x="230" y="100" width="314" height="30" rx="5" fill="#1e293b"/>
  <text x="554" y="121" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#111827">14:1</text>
  <text x="712" y="121" font-family="system-ui, sans-serif" font-size="13" fill="#6b7280">lolos</text>

  <!-- baris 3: putih di #4F46E5 6,3:1 -->
  <rect x="64" y="150" width="26" height="26" rx="4" fill="#4f46e5"/>
  <text x="77" y="169" font-family="system-ui, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">Aa</text>
  <text x="100" y="170" font-family="system-ui, sans-serif" font-size="14" fill="#475569">putih</text>
  <rect x="230" y="148" width="141" height="30" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="381" y="169" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#111827">6,3:1</text>
  <text x="712" y="169" font-family="system-ui, sans-serif" font-size="13" fill="#6b7280">lolos</text>

  <!-- baris 4: #1E293B di #F59E0B 6,8:1 -->
  <rect x="64" y="198" width="26" height="26" rx="4" fill="#f59e0b"/>
  <text x="77" y="217" font-family="system-ui, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle">Aa</text>
  <text x="100" y="218" font-family="system-ui, sans-serif" font-size="14" fill="#475569">#1E293B</text>
  <rect x="230" y="196" width="152" height="30" rx="5" fill="#1e293b"/>
  <text x="392" y="217" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#111827">6,8:1</text>
  <text x="712" y="217" font-family="system-ui, sans-serif" font-size="13" fill="#6b7280">lolos</text>

  <!-- baris 5: #16A34A di putih 3,3:1 gagal -->
  <rect x="64" y="246" width="26" height="26" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="77" y="265" font-family="system-ui, sans-serif" font-size="12" fill="#16a34a" text-anchor="middle">Aa</text>
  <text x="100" y="266" font-family="system-ui, sans-serif" font-size="14" fill="#475569">#16A34A</text>
  <rect x="230" y="244" width="74" height="30" rx="5" fill="#16a34a"/>
  <text x="314" y="265" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#111827">3,3:1</text>
  <text x="712" y="265" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#dc2626">tidak lolos</text>

  <!-- sumbu rasio -->
  <line x1="220" y1="300" x2="706" y2="300" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="230" y="320" font-family="system-ui, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">0</text>
  <text x="342" y="320" font-family="system-ui, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">5</text>
  <text x="454" y="320" font-family="system-ui, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">10</text>
  <text x="566" y="320" font-family="system-ui, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">15</text>
  <text x="678" y="320" font-family="system-ui, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">20</text>

  <!-- catatan bawah -->
  <text x="410" y="358" font-family="system-ui, sans-serif" font-size="16" fill="#111827" text-anchor="middle">Hijau murni aman untuk teks besar, gagal untuk label kecil</text>
</svg>
