<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" role="img" aria-label="Komposisi beranda Tokosaya di kiri dengan empat alat hierarki bernomor: ukuran, ketebalan, warna, dan ruang; kuncinya di kanan.">

  <!-- ============ halaman contoh ============ -->
  <rect x="16" y="14" width="470" height="330" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <rect x="17" y="15" width="468" height="150" rx="11" fill="#eef2ff"/>
  <rect x="17" y="134" width="468" height="31" fill="#eef2ff"/>

  <circle cx="38" cy="52" r="11" fill="#1d4ed8"/>
  <text x="38" y="57" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="64" y="66" font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#1e293b" letter-spacing="-0.5">Belanja Tepat,</text>
  <text x="64" y="106" font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#1e293b" letter-spacing="-0.5">Kirim Cepat</text>
  <rect x="64" y="120" width="140" height="26" rx="6" fill="#4f46e5"/>
  <text x="134" y="138" font-family="system-ui, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">Lihat Katalog</text>

  <circle cx="38" cy="190" r="11" fill="#1d4ed8"/>
  <text x="38" y="195" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="64" y="186" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#1e293b">Produk Terbaru</text>

  <circle cx="38" cy="232" r="11" fill="#1d4ed8"/>
  <text x="38" y="237" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="64" y="228" font-family="system-ui, sans-serif" font-size="14" fill="#334155">Peralatan kerja digital pilihan</text>
  <text x="64" y="248" font-family="system-ui, sans-serif" font-size="14" fill="#334155">untuk tim yang butuh cepat.</text>

  <circle cx="38" cy="292" r="11" fill="#1d4ed8"/>
  <text x="38" y="297" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="64" y="297" font-family="system-ui, sans-serif" font-size="13" fill="#6b7280">Harga sudah termasuk pajak</text>

  <!-- ============ kunci di kanan ============ -->
  <text x="506" y="44" font-family="system-ui, sans-serif" font-size="14" letter-spacing="1" fill="#1d4ed8">EMPAT ALAT</text>

  <circle cx="516" cy="84" r="11" fill="#1d4ed8"/>
  <text x="516" y="89" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="536" y="90" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#111827">Ukuran</text>
  <text x="536" y="112" font-family="system-ui, sans-serif" font-size="14" fill="#6b7280">30px judul, 14px isi</text>

  <circle cx="516" cy="140" r="11" fill="#1d4ed8"/>
  <text x="516" y="145" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="536" y="146" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#111827">Ketebalan</text>
  <text x="536" y="168" font-family="system-ui, sans-serif" font-size="14" fill="#6b7280">700 judul, 400 isi</text>

  <circle cx="516" cy="196" r="11" fill="#1d4ed8"/>
  <text x="516" y="201" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="536" y="202" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#111827">Warna</text>
  <text x="536" y="224" font-family="system-ui, sans-serif" font-size="14" fill="#6b7280">#1E293B judul, #334155 isi</text>

  <circle cx="516" cy="252" r="11" fill="#1d4ed8"/>
  <text x="516" y="257" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="536" y="258" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#111827">Ruang</text>
  <text x="536" y="280" font-family="system-ui, sans-serif" font-size="14" fill="#6b7280">32px antarblok</text>

  <!-- catatan bawah -->
  <text x="506" y="330" font-family="system-ui, sans-serif" font-size="15" fill="#111827">Penekanan hanya bekerja</text>
  <text x="506" y="350" font-family="system-ui, sans-serif" font-size="15" fill="#111827">kalau ada yang tidak ditekankan</text>
