<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" role="img" aria-label="Palet Tokosaya lima peran: primary indigo 4F46E5 untuk tombol dan link, primary dark 4338CA untuk hover dan gradien, accent amber F59E0B untuk badge, netral slate 1E293B sampai E2E8F0 untuk teks dan latar, semantik hijau 16A34A dan merah DC2626 untuk status.">

  <defs>
    <linearGradient id="slate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="0.45" stop-color="#475569"/>
      <stop offset="0.75" stop-color="#94a3b8"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <clipPath id="semantik">
      <rect x="432" y="206" width="226" height="90" rx="8"/>
    </clipPath>
  </defs>

  <!-- ============ baris 1, kartu 1: primary ============ -->
  <rect x="15" y="12" width="250" height="172" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <rect x="27" y="24" width="226" height="90" rx="8" fill="#4f46e5"/>
  <text x="27" y="132" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#111827">Primary</text>
  <text x="27" y="154" font-family="system-ui, sans-serif" font-size="15" fill="#475569">#4F46E5</text>
  <text x="27" y="175" font-family="system-ui, sans-serif" font-size="14" fill="#6b7280">tombol dan link utama</text>

  <!-- ============ baris 1, kartu 2: primary dark ============ -->
  <rect x="285" y="12" width="250" height="172" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <rect x="297" y="24" width="226" height="90" rx="8" fill="#4338ca"/>
  <text x="297" y="132" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#111827">Primary dark</text>
  <text x="297" y="154" font-family="system-ui, sans-serif" font-size="15" fill="#475569">#4338CA</text>
  <text x="297" y="175" font-family="system-ui, sans-serif" font-size="14" fill="#6b7280">hover dan latar gradien</text>

  <!-- ============ baris 1, kartu 3: accent ============ -->
  <rect x="555" y="12" width="250" height="172" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <rect x="567" y="24" width="226" height="90" rx="8" fill="#f59e0b"/>
  <text x="567" y="132" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#111827">Accent</text>
  <text x="567" y="154" font-family="system-ui, sans-serif" font-size="15" fill="#475569">#F59E0B</text>
  <text x="567" y="175" font-family="system-ui, sans-serif" font-size="14" fill="#6b7280">badge dan sorotan</text>

  <!-- ============ baris 2, kartu 4: netral slate ============ -->
  <rect x="150" y="194" width="250" height="172" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <rect x="162" y="206" width="226" height="90" rx="8" fill="url(#slate)"/>
  <text x="162" y="314" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#111827">Netral slate</text>
  <text x="162" y="336" font-family="system-ui, sans-serif" font-size="15" fill="#475569">#1E293B – #E2E8F0</text>
  <text x="162" y="357" font-family="system-ui, sans-serif" font-size="14" fill="#6b7280">heading, paragraf, latar</text>

  <!-- ============ baris 2, kartu 5: semantik ============ -->
  <rect x="420" y="194" width="250" height="172" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <g clip-path="url(#semantik)">
    <rect x="432" y="206" width="113" height="90" fill="#16a34a"/>
    <rect x="545" y="206" width="113" height="90" fill="#dc2626"/>
  </g>
  <text x="488" y="256" font-family="system-ui, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">sukses</text>
  <text x="601" y="256" font-family="system-ui, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">bahaya</text>
  <text x="432" y="314" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#111827">Semantik</text>
  <text x="432" y="336" font-family="system-ui, sans-serif" font-size="15" fill="#475569">#16A34A · #DC2626</text>
  <text x="432" y="357" font-family="system-ui, sans-serif" font-size="14" fill="#6b7280">status sukses dan bahaya</text>
</svg>
