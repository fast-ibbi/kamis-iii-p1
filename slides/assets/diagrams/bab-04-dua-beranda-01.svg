<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" role="img" aria-label="Dua beranda Tokosaya dengan isi sama: versi pertama berjudul kecil, paragraf berat, dan tombol abu-abu tipis; versi kedua berjudul tegas, paragraf tenang, dan tombol indigo.">

  <!-- ============ frame kiri: versi pertama, lemah ============ -->
  <rect x="10" y="20" width="386" height="300" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <path d="M22,20 L384,20 A12,12 0 0 1 396,32 L396,46 L10,46 L10,32 A12,12 0 0 1 22,20 Z" fill="#f1f5f9"/>
  <circle cx="30" cy="33" r="4" fill="#cbd5e1"/>
  <circle cx="43" cy="33" r="4" fill="#cbd5e1"/>
  <circle cx="56" cy="33" r="4" fill="#cbd5e1"/>
  <line x1="11" y1="46" x2="395" y2="46" stroke="#e5e7eb" stroke-width="2"/>

  <!-- judul kecil dan ragu -->
  <text x="32" y="82" font-family="system-ui, sans-serif" font-size="15" fill="#9ca3af">Belanja Tepat, Kirim Cepat</text>

  <!-- paragraf besar dan berat -->
  <text x="32" y="122" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#b6bec9">Peralatan kerja digital</text>
  <text x="32" y="146" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#b6bec9">untuk semua orang</text>

  <!-- tombol abu-abu tipis -->
  <rect x="32" y="172" width="112" height="28" rx="6" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="88" y="190" font-family="system-ui, sans-serif" font-size="13" fill="#9ca3af" text-anchor="middle">Lihat Katalog</text>

  <text x="203" y="288" font-family="system-ui, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">judul kecil · isi berat · tombol tipis</text>

  <!-- ============ frame kanan: versi kedua, kuat ============ -->
  <rect x="424" y="20" width="386" height="300" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <path d="M436,20 L798,20 A12,12 0 0 1 810,32 L810,46 L424,46 L424,32 A12,12 0 0 1 436,20 Z" fill="#eef2ff"/>
  <circle cx="444" cy="33" r="4" fill="#bfdbfe"/>
  <circle cx="457" cy="33" r="4" fill="#bfdbfe"/>
  <circle cx="470" cy="33" r="4" fill="#bfdbfe"/>
  <line x1="425" y1="46" x2="809" y2="46" stroke="#1d4ed8" stroke-width="2"/>

  <!-- judul besar dan tegas -->
  <text x="446" y="92" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#1e293b" letter-spacing="-0.4">Belanja Tepat,</text>
  <text x="446" y="122" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#1e293b" letter-spacing="-0.4">Kirim Cepat</text>

  <!-- paragraf tenang -->
  <text x="446" y="150" font-family="system-ui, sans-serif" font-size="13" fill="#334155">Peralatan kerja digital untuk tim</text>
  <text x="446" y="168" font-family="system-ui, sans-serif" font-size="13" fill="#334155">yang butuh cepat dan rapi.</text>

  <!-- tombol indigo tegas -->
  <rect x="446" y="184" width="132" height="32" rx="7" fill="#4f46e5"/>
  <text x="512" y="204" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Lihat Katalog</text>
  <text x="588" y="204" font-family="system-ui, sans-serif" font-size="12" fill="#4f46e5">gratis ongkir</text>

  <text x="617" y="288" font-family="system-ui, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">judul tegas · isi tenang · tombol indigo</text>

  <!-- ============ catatan bawah ============ -->
  <text x="410" y="356" font-family="system-ui, sans-serif" font-size="16" fill="#475569" text-anchor="middle">Isi kedua beranda sama persis</text>
</svg>
